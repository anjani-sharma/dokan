services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ananta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-shopdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ananta} -d ${POSTGRES_DB:-shopdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ananta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopdb}
    volumes:
      - uploads:/app/images        # persistent invoice + payment slip photos
    depends_on:
      db:
        condition: service_healthy
    command: bash start.sh

  # ── Telegram bot ────────────────────────────────────────────────────────────
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      IMAGES_DIR:  /app/images
    volumes:
      - uploads:/app/images        # same volume — bot downloads here, backend reads here
    depends_on:
      - backend

  # ── Dashboard (React build served by nginx) ─────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always

  # ── nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro    # SSL certs (Let's Encrypt)
      - nginxlogs:/var/log/nginx
    depends_on:
      - backend
      - dashboard

volumes:
  pgdata:      # all database data — never lost
  uploads:     # all invoice photos and payment slips — never lost
  nginxlogs:
