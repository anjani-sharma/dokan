services:
  # ── Backend (FastAPI + Telegram bot via webhook) ──────────────────────────
  - type: web
    name: ananta-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ananta-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SHOP_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false          # set to: https://ananta-backend.onrender.com
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: IMAGES_DIR
        value: /tmp/ananta_images
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
    healthCheckPath: /health

databases:
  - name: ananta-db
    plan: free
    databaseName: shopdb
    user: ananta
